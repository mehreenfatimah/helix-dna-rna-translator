[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-translator"
version = "1.0.0"
description = "Educational DNA/RNA six-frame translation and ORF analysis tool"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[tool.setuptools.packages.find]
where = ["src"]
